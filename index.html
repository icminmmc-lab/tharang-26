<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#17365D">
  <title>THARANG'26 | Event Finder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="hero">
      <div class="brand">
        <div class="logo">MMC</div>
        <div class="college">
          MARY MATHA COLLEGE OF ARTS & SCIENCE<br>
          PERIYAKULAM
        </div>
      </div>
      <h1>THARANG'26</h1>
      <p>Inter-College Cultural Meet · Event Finder</p>
      <span class="date">📅 09 OCTOBER 2026</span>
    </header>

    <section id="home">
      <div class="search-box">
        <span>⌕</span>
        <input id="search" type="search"
          placeholder="Search event or event code..."
          aria-label="Search event">
      </div>

      <div class="filters">
        <button class="filter active" data-filter="All">All Events</button>
        <button class="filter" data-filter="Group">Group</button>
        <button class="filter" data-filter="Individual">Individual</button>
        <button class="filter" data-filter="Online">Online</button>
      </div>

      <div class="section-title">
        <strong>Find Your Event</strong>
        <span id="count"></span>
      </div>

      <div id="eventList"></div>
    </section>

    <section id="details" class="details hidden">
      <button id="back" class="back">← All Events</button>
      <div id="detailsContent"></div>
    </section>

    <footer>
      <strong>THARANG'26</strong>
      <span>Mary Matha College of Arts & Science, Periyakulam</span>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
